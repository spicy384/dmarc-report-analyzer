# Lints, runs the test suite, then builds the container image and publishes it to GitHub Container Registry, so a
# management server can `docker compose pull` instead of building from source.
#
#   ghcr.io/spicy384/dmarc-report-analyzer:latest   every push to main
#   ghcr.io/spicy384/dmarc-report-analyzer:1.2.3    a tag v1.2.3 (also :1.2)
#   ghcr.io/spicy384/dmarc-report-analyzer:sha-<7>  every build, by commit
#
# The package is private until its visibility is changed once on GitHub:
# the package page -> Package settings -> Danger Zone -> Change visibility.
name: Test and publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Lint and the whole test suite run first; nothing is published if they fail.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Test
        run: npm test

  build-and-push:
    needs: test
    # Pull requests are checked but never published.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # arm64 too, for a Raspberry Pi or an ARM VM as the management server.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
