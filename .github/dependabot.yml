# Keeps the npm dependencies and the GitHub Actions versions current, so a
# deprecation notice arrives as a pull request instead of a surprise in the log.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for all patch and minor bumps; majors come on their own.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
